# The Rust protovcs client. See protovcs/src/lib.rs.
#
# Its tests reproduce the golden vectors the Go client writes to
# ../testdata/golden/vectors.json, so the two clients write the same bytes.

[workspace]
members = ["idbcache", "memtransport", "proto", "protovcs"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nextgui/protovcs"
publish = false

[workspace.dependencies]
buffa = "=0.9.2"
buffa-descriptor = "=0.9.2"
buffa-types = "=0.9.2"
connectrpc = { version = "=0.9.1", default-features = false }
futures = "0.3"
js-sys = "0.3"
protovcs = { path = "protovcs" }
protovcs-memtransport = { path = "memtransport" }
protovcs-proto = { path = "proto" }
protox = "0.10"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[workspace.lints.rust]
missing_docs = "deny"
