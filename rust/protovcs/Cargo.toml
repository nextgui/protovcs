[package]
name = "protovcs"
description = "A client for protovcs: one large protobuf message stored as versioned encrypted chunks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# tests/support.rs is shared by the two tests, not a test of its own.
autotests = false

[features]
# Hooks for fixed keys, nonces and entropy, which the golden vectors need.
# Never enable it outside tests: a fixed nonce breaks AES-GCM.
test-util = []

# FetchTransport, a connect-rust ClientTransport over the browser's fetch.
# It is compiled only for wasm32.
fetch = [
    "dep:bytes",
    "dep:http",
    "dep:http-body-util",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[dependencies]
aes-gcm = "0.10"
buffa.workspace = true
buffa-descriptor = { workspace = true, features = ["reflect"] }
buffa-types.workspace = true
connectrpc.workspace = true
futures.workspace = true
futures-timer = "3"
getrandom = "0.2"
hkdf = "0.12"
hmac = "0.12"
http-body = "1"
protovcs-proto.workspace = true
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bytes = { version = "1", optional = true }
getrandom = { version = "0.2", features = ["js"] }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
js-sys.workspace = true
futures-timer = { version = "3", features = ["wasm-bindgen"] }
send_wrapper = { version = "0.6", features = ["futures"] }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Headers",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Request",
    "RequestInit",
    "Response",
] }

[dev-dependencies]
protovcs = { path = ".", features = ["test-util"] }
protovcs-memtransport.workspace = true
protox.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[[test]]
name = "golden_test"

[[test]]
name = "store_test"

[lints]
workspace = true
